name: Replacement Offline Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements.txt
      - name: Offline regression tests
        env:
          PYTHONPATH: python
          GREENLIGHT_DATA_DIR: ${{ runner.temp }}/greenlight-unit-data
          GREENLIGHT_CACHE_DIR: ${{ runner.temp }}/greenlight-unit-cache
        run: pytest -q python/tests
