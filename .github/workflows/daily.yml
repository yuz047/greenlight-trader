name: Private yfinance Pipeline Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: greenlight-yfinance-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements.txt
      - name: Fetch explicit recovery baseline
        run: git fetch --depth=1 origin 164c8a307449d6ce63e7f70bb829515b4c5eae31
      - name: Initialize and validate private runtime
        env:
          PYTHONPATH: python
          GREENLIGHT_DATA_DIR: ${{ runner.temp }}/greenlight-validation-data
          GREENLIGHT_CACHE_DIR: ${{ runner.temp }}/greenlight-validation-cache
        run: |
          python python/initialize_migration.py
          python python/run_pipeline.py
      # No commits, Pages deployments, or runtime-data artifact uploads.
