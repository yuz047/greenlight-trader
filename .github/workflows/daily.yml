name: Greenlight Daily

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    concurrency:
      group: greenlight-massive-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Check live data secrets
        id: live-data
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          if [ -z "$MASSIVE_API_KEY" ] && [ -z "$POLYGON_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live daily allocator skipped because MASSIVE_API_KEY or POLYGON_API_KEY is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily allocator
        if: steps.live-data.outputs.enabled == 'true'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_BASE_URL: ${{ secrets.MASSIVE_API_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          MASSIVE_FORCE_REFRESH: "1"
          PYTHONPATH: python
        run: python python/run_daily.py

      - name: Validate outputs
        env:
          PYTHONPATH: python
        run: |
          python python/validate_outputs.py
          python python/validate_watermarks.py
          python python/validate_dashboard_data.py

      - name: Commit data updates
        if: steps.live-data.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Greenlight daily data"
            git push
          fi
