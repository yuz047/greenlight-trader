name: GreenLight daily

on:
  schedule:
    # 00:30 UTC Tue–Sat ≈ 20:30 ET Mon–Fri (after the US close).
    - cron: '30 0 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (append today) or seed (rebuild ~2y history from scratch)'
        type: choice
        required: true
        default: 'daily'
        options: ['daily', 'seed']

permissions:
  contents: write   # so the job can commit refreshed data/*.json back to the repo

env:
  # GitHub is forcing JS actions to Node 24 on 2026-06-02; opt in now so the
  # warning goes away and we never run into a surprise upgrade.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install deps
        run: pip install -r python/requirements.txt

      - name: Run daily engine
        if: github.event.inputs.mode != 'seed'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: python
        run: python run_daily.py

      - name: Seed history (rebuild ~2y backtest)
        if: github.event.inputs.mode == 'seed'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: python
        run: python seed_history.py

      - name: Commit refreshed data/
        run: |
          git config user.name "greenlight-bot"
          git config user.email "greenlight-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            mode="${{ github.event.inputs.mode || 'daily' }}"
            git commit -m "data: $mode refresh $(date -u +%Y-%m-%d)"
            git push
          fi
