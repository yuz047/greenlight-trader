name: Private Research Backtest

on:
  workflow_dispatch:
    inputs:
      train_start:
        description: 'Training start; warmup needs another 430 days of complete histories'
        required: true
        default: '2023-06-01'
      train_end:
        description: 'Initial training cutoff'
        required: true
        default: '2026-08-31'
      invest_start:
        description: 'Investment replay start'
        required: true
        default: '2026-09-01'
      end_date:
        description: 'Completed trading session'
        required: true
        default: '2026-10-05'
      max_symbols:
        description: 'Explicit candidate cap'
        required: true
        default: '8'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements.txt
      - name: Strict research replay
        env:
          PYTHONPATH: python
          GREENLIGHT_DATA_DIR: ${{ runner.temp }}/greenlight-backtest-data
          GREENLIGHT_CACHE_DIR: ${{ runner.temp }}/greenlight-backtest-cache
          TRAIN_START: ${{ inputs.train_start }}
          TRAIN_END: ${{ inputs.train_end }}
          INVEST_START: ${{ inputs.invest_start }}
          END_DATE: ${{ inputs.end_date }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
        run: |
          python python/backtest.py --start-date "$TRAIN_START" --train-start "$TRAIN_START" --train-end "$TRAIN_END" --invest-start "$INVEST_START" --end-date "$END_DATE" --max-symbols "$MAX_SYMBOLS" --rolling-train-years 3 --ai-memo-mode off --ai-memo-frequency final --no-synthetic-fallback --no-secondary-price-fallback
      # Research output remains ephemeral; no public data artifacts.
