name: Publish Dashboard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-dashboard.yml"
      - "web/**"
      - "data/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: greenlight-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate dashboard data
        run: |
          python -m pip install -r python/requirements.txt
          PYTHONPATH=python python python/validate_dashboard_data.py

      - name: Build static site payload
        run: |
          mkdir -p site
          cp web/index.html web/styles.css web/app.js site/
          mkdir -p site/web
          cp web/index.html web/styles.css web/app.js site/web/
          cp -R data site/data

      - name: Check Pages enablement
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            cat /tmp/pages.json
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository. Dashboard data and static payload validated; enable Pages with source 'GitHub Actions' to deploy."
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
